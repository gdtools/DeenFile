name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64 GCC)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-i686-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          gcc -O2 -s -municode -Wall -o deenfile_x64.exe deenfile.c
          /mingw32/bin/gcc -O2 -s -municode -Wall -o deenfile_x86.exe deenfile.c
          ls -l deenfile_x64.exe deenfile_x86.exe

      - name: Smoke test
        shell: msys2 {0}
        run: |
          ./deenfile_x64.exe level
          ./deenfile_x64.exe badcmd
          ./deenfile_x86.exe level
          ./deenfile_x86.exe badcmd

      - name: Package
        shell: pwsh
        run: |
          Copy-Item deenfile_x64.exe "deenfile_${env:TAG_NAME}_x64.exe"
          Copy-Item deenfile_x86.exe "deenfile_${env:TAG_NAME}_x86.exe"
          Get-ChildItem "deenfile_${env:TAG_NAME}_*.exe" | Select-Object Name, Length

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: deenfile ${{ env.TAG_NAME }}
          files: |
            deenfile_${{ env.TAG_NAME }}_x64.exe
            deenfile_${{ env.TAG_NAME }}_x86.exe
          generate_release_notes: true
          body: |
            ## 用法速查

            | 命令 | 需要密码 | 说明 |
            |---|---|---|
            | `deenfile` | 否 | 交互界面 |
            | `deenfile add <dir>` | 是 | 登记目录 |
            | `deenfile encode` | 否 | 加密全部登记目录 |
            | `deenfile decode [force]` | 是 | 解密全部登记目录 |
            | `deenfile pwd` | 是 | 修改密码 |
            | `deenfile level [1\|2]` | 查询否 / 修改是 | 安全等级（缺省 1） |
            | `deenfile list` | 是 | 查看已登记目录 |

            等级 1 = 目录隐藏 + 文件名偏移，不碰文件内容（快）；等级 2 = 额外混淆文件头（慢）。
            修改密码 / 等级前会自动全量解密，失败则整体放弃，不会留半成品。
            提供 `_x64` 与 `_x86`（32 位）两个版本，Windows 7 及以上可直接运行，无需安装第三方运行库。
